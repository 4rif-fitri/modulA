<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Drag and Drop Kanban Board</title>
	<style>
		*{padding: 0;margin: 0;box-sizing: border-box;}
		body{
			background-color: #eee;
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: Arial, Helvetica, sans-serif;
		}
		main{
			height: 70%;
			width: 95%;
			display: grid;
			grid-template-columns: repeat(3,1fr);
			gap: 1rem;
		}
		main > section{
			background-color: #fff;
			padding: 0.5rem;
			display: flex;
			flex-direction: column;
			gap: 1rem;
		}
		main > section > h1{
			text-align: center;
		}
		.inputControl{
			width: 100%;
			display: grid;
			grid-template-columns: 4fr 1fr;
			gap: 0.5rem;
			height: 2rem;
		}
		.inputControl > input{
			padding: 0.5rem;
		}
		.inputControl > button{
			background-color: lightslategray;
			color: #fff;
			font-size: 1.5rem;
		}
		.task{
			display: grid;
			grid-template-columns: 4fr auto;
			place-items: center;
			background-color: #eee;
			padding: 1rem;
			cursor:move;
		}
		.task button{
			padding: 1rem;
			width: 2rem;
			height: 2rem;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: red;
		}
	</style>
</head>
<body>
	<main>
		<section>
			<h1>To Do</h1>
			<div class="inputControl">
				<input data-type="toDo" type="text" placeholder="Add Task">
				<button>+</button>
			</div>

			<div class="task">
				<h4>Lorem ipsum dolor sit amet Lorem ipsum dolor sit amet Lorem ipsum dolor sit amet</h4>
				<button>X</button>
			</div>
		</section>
		
		<section>
			<h1>In Progress</h1>
			<div class="inputControl">
				<input data-type="inProgress" type="text" placeholder="Add Task">
				<button>+</button>
			</div>
			<div class="task">
				<h4>Lorem ipsum dolor sit amet Lorem ipsum dolor sit amet Lorem ipsum dolor sit amet</h4>
				<button>X</button>
			</div>
		</section>

		<section>
			<h1>Done</h1>
			<div class="inputControl">
				<input data-type="done" type="text" placeholder="Add Task">
				<button>+</button>
			</div>
			<div class="task">
				<h4>Lorem ipsum dolor sit amet Lorem ipsum dolor sit amet Lorem ipsum dolor sit amet</h4>
				<button>X</button>
			</div>
		</section>
	</main>
</body>
</html>
