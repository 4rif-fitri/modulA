<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Drag and Drop Kanban Board</title>
	<link rel="stylesheet" href="./style.css">

</head>

<body>
	<main>
		<h1>To Do</h1>
		<h1>In Progress</h1>
		<h1>Done</h1>

		<div class="inputControl">
			<input id="textToDo" required type="text" placeholder="Add Task">
			<button id="btnToDo" data-type="toDo">+</button>
		</div>

		<div class="inputControl">
			<input id="textInProgress" required type="text" placeholder="Add Task">
			<button id="btnInProgress" data-type="inProgress">+</button>
		</div>

		<div class="inputControl">
			<input  id="textDone" required type="text" placeholder="Add Task">
			<button id="btnDone" data-type="done">+</button>
		</div>

		<h3 id="countToDo">Task: 0</h3>
		<h3 id="countInProgress">Task: 0</h3>
		<h3 id="countDone">Task: 0</h3>

		<section class="container" id="containerToDo" data-type="toDo"></section>
		<section class="container" id="containerInProgress" data-type="inProgress"></section>
		<section class="container" id="containerDone" data-type="done"></section>
	</main>
	<script src="./app.js"></script>
</body>

</html>
