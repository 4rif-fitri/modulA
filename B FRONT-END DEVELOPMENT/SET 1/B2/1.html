<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Wildcard Pattern Matching</title>

	<style>
		body {
			font-family: Arial, sans-serif;
			background: #f0f0f0;
			padding: 2rem;
		}

		.container {
			max-width: 700px;
			margin: auto;
			background: white;
			padding: 2rem;
			border-radius: 10px;
		}

		h1 {
			margin-bottom: 1rem;
		}

		table {
			width: 100%;
			border-collapse: collapse;
		}

		th,
		td {
			border: 1px solid #ccc;
			padding: 12px;
			text-align: left;
		}

		th {
			background: #eee;
		}

		.true {
			color: green;
			font-weight: bold;
		}

		.false {
			color: red;
			font-weight: bold;
		}
	</style>
</head>

<body>

	<div class="container">

		<h1>String Pattern Matching with Wildcards</h1>

		<p>
			<b>*</b> = matches zero or more characters<br>
			<b>?</b> = matches exactly one character
		</p>

		<table>
			<thead>
				<tr>
					<th>Text</th>
					<th>Pattern</th>
					<th>Result</th>
				</tr>
			</thead>

			<tbody id="resultBody"></tbody>
		</table>

	</div>

	<script>

		// Dynamic Programming Solution
		function matchPattern(text, pattern) {

			let rows = text.length + 1
			let cols = pattern.length + 1

			let dp = Array.from({ length: rows }, () =>
				Array(cols).fill(false)
			)

			dp[0][0] = true

			// Handle patterns like *, **, ***
			for (let j = 1; j < cols; j++) {
				if (pattern[j - 1] === "*") {
					dp[0][j] = dp[0][j - 1]
				}
			}

			for (let i = 1; i < rows; i++) {

				for (let j = 1; j < cols; j++) {

					// Exact match OR ?
					if (
						pattern[j - 1] === text[i - 1] ||
						pattern[j - 1] === "?"
					) {
						dp[i][j] = dp[i - 1][j - 1]
					}

					// *
					else if (pattern[j - 1] === "*") {

						// 0 character OR many characters
						dp[i][j] =
							dp[i][j - 1] ||
							dp[i - 1][j]
					}
				}
			}

			return dp[text.length][pattern.length]
		}

		// Test Cases
		let tests = [
			["hello", "h*o"],
			["hello", "h?llo"],
			["hello", "h?l"],
			["test", "*est"],
			["test", "t*t"],
			["hello", "h*l*o"]
		]

		let resultBody = document.getElementById("resultBody")

		tests.forEach(test => {

			let text = test[0]
			let pattern = test[1]

			let result = matchPattern(text, pattern)

			let row = `
				<tr>
					<td>${text}</td>
					<td>${pattern}</td>
					<td class="${result ? 'true' : 'false'}">
						${result}
					</td>
				</tr>
			`

			resultBody.innerHTML += row
		})

	</script>

</body>

</html>
