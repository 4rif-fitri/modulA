<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Analog Clock</title>
	<link rel="stylesheet" href="./style.css">
</head>

<body>

	<div class="jamContainer">
		<div class="center">
			<h3 class="hour hour-1">1</h3>
			<h3 class="hour hour-2">2</h3>
			<h3 class="hour hour-3">3</h3>
			<h3 class="hour hour-4">4</h3>
			<h3 class="hour hour-5">5</h3>
			<h3 class="hour hour-6">6</h3>
			<h3 class="hour hour-7">7</h3>
			<h3 class="hour hour-8">8</h3>
			<h3 class="hour hour-9">9</h3>
			<h3 class="hour hour-10">10</h3>
			<h3 class="hour hour-11">11</h3>
			<h3 class="hour hour-12">12</h3>

			<div class="arrow long"></div>
			<div class="arrow midd"></div>
			<div class="arrow short"></div>
			<div class="dot"></div>
		</div>
	</div>

	<script src="./app.js"></script>
</body>

</html>
