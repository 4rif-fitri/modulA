<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		/* center screen */
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
}

/* container */
.ripple-container {
    position: relative;
    width: 80px;
    height: 80px;
}

/* center circle */
.center-circle {
    width: 80px;
    height: 80px;
    background: #3498db;
    border-radius: 50%;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
}

/* ripple base */
.ripple {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #3498db;
    transform: translate(-50%, -50%);
    opacity: 0;
    z-index: 1;

    animation: ripple 3s infinite;
}

/* stagger delay */
.r1 { animation-delay: 0s; }
.r2 { animation-delay: 0.5s; }
.r3 { animation-delay: 1s; }

/* animation */
@keyframes ripple {
    0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.6;
    }
    100% {
        transform: translate(-50%, -50%) scale(3.125); /* 250/80 ≈ 3.125 */
        opacity: 0;
    }
}
	</style>
</head>
<body>
	<div class="ripple-container">
		<div class="center-circle"></div>
		<div class="ripple r1"></div>
		<div class="ripple r2"></div>
		<div class="ripple r3"></div>
	</div>
</body>
</html>
