<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		/* center page */
		body {
			margin: 0;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			background: #eee;
		}

		/* clock face */
		.clock {
			width: 400px;
			height: 400px;
			border: 4px solid black;
			border-radius: 50%;
			background: #fff;
			position: relative;
		}

		/* center dot */
		.clock::after {
			content: "";
			position: absolute;
			width: 12px;
			height: 12px;
			background: black;
			border-radius: 50%;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
		}

		/* common marker style */
		.marker {
			position: absolute;
			width: 4px;
			height: 18px;
			background: black;
			top: 10px;
			left: 50%;
			transform-origin: center 190px;
			/* radius clock */
		}

		/* big markers (12,3,6,9) */
		.marker.big {
			width: 6px;
			height: 26px;
			background: #000;
		}

		/* position each hour marker */
		.m1 {
			transform: rotate(0deg);
		}

		.m2 {
			transform: rotate(30deg);
		}

		.m3 {
			transform: rotate(60deg);
		}

		.m4 {
			transform: rotate(90deg);
		}

		.m5 {
			transform: rotate(120deg);
		}

		.m6 {
			transform: rotate(150deg);
		}

		.m7 {
			transform: rotate(180deg);
		}

		.m8 {
			transform: rotate(210deg);
		}

		.m9 {
			transform: rotate(240deg);
		}

		.m10 {
			transform: rotate(270deg);
		}

		.m11 {
			transform: rotate(300deg);
		}

		.m12 {
			transform: rotate(330deg);
		}

		/* highlight cardinal points */
		.m12,
		.m3,
		.m6,
		.m9 {
			width: 6px;
			height: 26px;
		}
	</style>
</head>

<body>
	<div class="clock">
		<div class="marker m1"></div>
		<div class="marker m2"></div>
		<div class="marker m3"></div>
		<div class="marker m4"></div>
		<div class="marker m5"></div>
		<div class="marker m6"></div>
		<div class="marker m7"></div>
		<div class="marker m8"></div>
		<div class="marker m9"></div>
		<div class="marker m10"></div>
		<div class="marker m11"></div>
		<div class="marker m12"></div>
	</div>
</body>

</html>
