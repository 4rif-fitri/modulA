<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		*{padding: 0;margin: 0;box-sizing: border-box;}

		body{
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: lightgoldenrodyellow;
		}
		.container{
			background-color: #fff;
			width: 300px;
			height: 300px;
			border-radius: 50%;
			display: grid;
			grid-template-rows: 1fr 1fr;
			border-radius: 50%;
			overflow: hidden;
		}
		.container >div{
			position: relative;
		}			

		.yin{
			background-color: white;
		}
		.yin::before{
			content: "";
			position: absolute;
			width: 20%;
			aspect-ratio: 1 / 1;
			background-color: black;
			bottom: 0;
			z-index: 20;
			left: 10%;
			border-radius: 50%;
		}
		.yin::after{
			content: "";
			position: absolute;
			width: 50%;
			aspect-ratio: 1 / 1;
			background-color: white;
			bottom: -50%;
			z-index: 10;
			border-radius: 50%;		
		}
		.yang{
			background-color: black;
		}
		.yang::before{
			content: "";
			position: absolute;
			width: 20%;
			aspect-ratio: 1 / 1 !important;
			background-color: white;
			bottom: 0;
			z-index: 20;
			border-radius: 50%;
			right: 0;
		}
		.yang::after{
			content: "";
			position: absolute;
			width: 50%;
			aspect-ratio: 1 / 1;
			background-color: black;
			bottom: 50%;
			z-index: 10;
			right: 0;
			border-radius: 50%;
		}	
	</style>
</head>
<body>
	<div class="container">
		<div class="yin">

		</div>
		<div class="yang"></div>
	</div>
</body>
</html>
