<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		*{padding: 0;margin: 0;box-sizing: border-box;}

		body{
			height: 100vh;
			background-color: lightgoldenrodyellow;
			
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.card{
			width: 280px;
			height: 380px;

			position: relative;
			perspective: 1000px;
		}
		.innerCard{
			width: 100%;
			height: 100%;
			transition: all 0.6s;
			transform-style: preserve-3d;
		}
		.front, .back{
			width: 100%;
			height: 100%;
			position: absolute;
			backface-visibility: hidden;

			display: flex;
			align-items: center;
			justify-content: center;
		}
		.front{
			background-color: lightblue;
		}
		.back{
			background-color: lightcoral;
			transform: rotateY(180deg);
		}

		.card:hover .innerCard{
			transform: rotateY(180deg);
		}
	</style>
</head>
<body>
	<div class="card">
		<div class="innerCard">
			<div class="back">
				<h1>Back</h1>
			</div>
			<div class="front">
				<h1>Front</h1>
			</div>
		</div>
	</div>
</body>
</html>
