<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		*{
			padding: 0;margin: 0;box-sizing: border-box;
		}
		body{
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.card{
			width: 290px;
			height: 380px;
			perspective: 1000px;
		}
		.innerCard{	
			width: 100%;
			height: 100%;

			transform-style: preserve-3d;
			position: relative;

			transition: all 0.8s;
		}
		.back, .front{
			position: absolute;
			height: 100%;
			width: 100%;

			display: flex;
			align-items: center;
			justify-content: center;

			backface-visibility: hidden;
		}
		.back{
			background-color: lightcoral;
			transform: rotateY(180deg);
		}
		.front{
			background-color: lightblue;
			background-image: url("./88.jpg");
			background-size: cover;
			background-position: center;
		}

		body:has(#checkbox:checked) .innerCard{
			transform: rotateY(180deg);
		}
	</style>
</head>
<body>
	<input type="checkbox" hidden name="checkbox" id="checkbox">
	<label for="checkbox">
		<div class="card">
			<div class="innerCard">
				<div class="back">
					<h1>Back</h1>
				</div>
				<div class="front">
					<h1>Front</h1>
				</div>
			</div>
		</div>
	</label>
</body>
</html>
