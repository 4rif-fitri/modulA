<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		body {
			background-color: lightgreen;
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.card {
			width: 250px;
			height: 300px;
			perspective: 1000px;
		}

		.innerCard {
			position: relative;
			width: 100%;
			height: 100%;
			transition: transform 0.6s;
			transform-style: preserve-3d;
		}

		.innerCard>div {
			position: absolute;
			height: 100%;
			width: 100%;
			backface-visibility: hidden;
		}

		.cardFront {
			background-color: lightblue;
		}

		.cardBack {
			background-color: lightcoral;
			transform: rotateY(180deg);
		}

		.crad:hover .innerCard {
			transform: translateY(180deg);
		}
	</style>
</head>

<body>
	<div class="card">
		<div class="innerCard">
			<div class="cardFront">
				<h1>Front</h1>
			</div>
			<div class="cardBack">
				<h1>Back</h1>
			</div>
		</div>
	</div>
</body>

</html>
